[project]
name = "edugraph-classify"
version = "0.1.0"
description = "Training and evaluation tooling for direct ontology labeling of educational tasks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.0.1",
    "fireworks-ai>=1.2.9",
]
classifiers = ["Private :: Do Not Upload"]

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"
