[project]
name = "edugraph-classify"
version = "0.1.0"
description = "Training and evaluation tooling for direct ontology labeling of educational tasks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.0.1",
    "fireworks-ai>=1.2.9",
    "python-dotenv>=1.2.3",
]
classifiers = ["Private :: Do Not Upload"]

[project.scripts]
edugraph-classify = "edugraph_classify.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers --basetemp=temp/pytest"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["edugraph_classify"]
omit = ["*/__main__.py"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true
