[project]
name = "edugraph-classify"
version = "0.1.0"
description = "Training and evaluation tooling for direct ontology labeling of educational tasks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.0.1",
    "edugraph-py",
    "fireworks-ai==1.2.15",
    "fsspec>=2026.6.0",
    "google-cloud-aiplatform>=1.122.0,<2",
    "google-cloud-storage>=3.13.1,<4",
    "pillow>=12.3.0",
    "python-dotenv>=1.2.3",
]
classifiers = ["Private :: Do Not Upload"]

[project.scripts]
edugraph-classify = "edugraph_classify.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jinja2>=3.1.6",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
training = [
    "accelerate==1.14.0",
    "bitsandbytes==0.50.1",
    "peft==0.20.0",
    "torch==2.13.0",
    "torchvision==0.28.0",
    "transformers==5.15.1",
]
training-api = [
    "fireworks-ai[training-sdk]==1.2.15",
    "torch==2.13.0",
    "torchvision==0.28.0",
    "transformers==5.15.1",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers --basetemp=temp/pytest"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["edugraph_classify"]
omit = ["*/__main__.py"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cu126", marker = "sys_platform != 'win32'" },
]
torchvision = [
    { index = "pytorch-cpu", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cu126", marker = "sys_platform != 'win32'" },
]
edugraph-py = { url = "https://github.com/christian-bick/edugraph-ontology/releases/download/v0.30.0/edugraph_py-0.30.0-py3-none-any.whl" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
