# Submit only this small directory. The 17.5 GB candidate is fetched by generation
# inside Cloud Build and cryptographically checked before Docker sees any model files.
steps:
  - id: prepare-verified-context
    # The pinned slim variant includes python3; stable did not expose it in PATH.
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim@sha256:be4876b4311056bf3ce236a14a7dea1288e70b7cfea2454ea15e4165c819921f
    entrypoint: python3
    args:
      - prepare_context.py
      - --profile
      - '${_RELEASE_PROFILE}'
      - --model-hf-revision
      - '${_MODEL_HF_REVISION}'
  - id: build
    name: gcr.io/cloud-builders/docker@sha256:001fb4a870a84485cf198c80002f7af42f6456f2dbc261d70a0b5f0111470df4
    args:
      - build
      - -t
      - 'europe-west4-docker.pkg.dev/edugraph-438718/edugraph-predict/qwen38-27b-gguf:${_MODEL_HF_REVISION}'
      - /workspace/build-context
images:
  - 'europe-west4-docker.pkg.dev/edugraph-438718/edugraph-predict/qwen38-27b-gguf:${_MODEL_HF_REVISION}'
timeout: 7200s
options:
  machineType: E2_HIGHCPU_8
  diskSizeGb: '500'
  logging: CLOUD_LOGGING_ONLY
  sourceProvenanceHash:
    - SHA256
