name: Publish training image

on:
  # An explicitly pushed release tag also works before workflow_dispatch is on main.
  push:
    tags: ["trainer-*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Push the checked image to GHCR (unchecked builds only)
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: training-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      # The image and digest are sufficient; avoid storing a second large build record.
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    steps:
      - name: Check out the selected commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Identify the image
        id: identity
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}-trainer"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "tag=$image:sha-$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Make room for the CUDA environment
        shell: bash
        run: |
          # These unused SDKs belong to this fresh, disposable GitHub-hosted runner.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: inputs.publish || startsWith(github.ref, 'refs/tags/trainer-')
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, check, and optionally publish
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: containers/vertex-trainer/Dockerfile
          platforms: linux/amd64
          push: ${{ inputs.publish || startsWith(github.ref, 'refs/tags/trainer-') }}
          build-args: CODE_COMMIT=${{ github.sha }}
          tags: ${{ steps.identity.outputs.tag }}
          labels: |
            org.opencontainers.image.title=EduGraph classifier trainer
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
          provenance: mode=max

      - name: Record the published image
        if: inputs.publish || startsWith(github.ref, 'refs/tags/trainer-')
        shell: bash
        env:
          IMAGE: ${{ steps.identity.outputs.image }}
          IMAGE_TAG: ${{ steps.identity.outputs.tag }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          {
            echo "### Published training image"
            echo ""
            echo "- Image: \`$IMAGE@$IMAGE_DIGEST\`"
            echo "- Tag: \`$IMAGE_TAG\`"
            echo "- Code commit: \`$GITHUB_SHA\`"
            echo "- Platform: \`linux/amd64\`"
            echo "- Lockfile SHA-256: \`$(sha256sum uv.lock | cut -d ' ' -f 1)\`"
            echo ""
            echo "Use the image digest in run configuration. Publication does not change package visibility."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record the build-only result
        if: ${{ !inputs.publish && !startsWith(github.ref, 'refs/tags/trainer-') }}
        shell: bash
        run: echo "Image built and checked locally on the runner; nothing was published." >> "$GITHUB_STEP_SUMMARY"
